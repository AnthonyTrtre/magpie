name: Magpie
options:
  bundleIdPrefix: fr.anthony
  deploymentTarget: { macOS: "26.0" }
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
packages:
  Socle:
    path: Socle
  # Mises à jour intégrées (MIT), version épinglée : https://github.com/sparkle-project/Sparkle
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Magpie:
    type: application
    platform: macOS
    sources: [Sources, Ressources]
    info:
      path: Info.plist
      properties:
        LSUIElement: true            # app de barre de menus, sans icône dans le Dock ; retirer pour une app à fenêtre
        NSHumanReadableCopyright: "Usage personnel"
        CFBundleShortVersionString: $(MARKETING_VERSION)   # sinon XcodeGen fige « 1.0 »
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)   # croissant d'une version publiée à l'autre : Sparkle s'en sert
        SUFeedURL: https://github.com/AnthonyTrtre/magpie/releases/latest/download/appcast.xml
        SUPublicEDKey: DOU0YZsuQSrqCEm5mezjHVUDgYv1JbOHdgEal9Q4uS8=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true    # téléchargées en arrière-plan, installées à la fermeture
        SUScheduledCheckInterval: 21600
        SUVerifyUpdateBeforeExtraction: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.anthony.magpie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
    dependencies:
      - package: Socle
        product: SocleCore
      - package: Socle
        product: SocleBarreDeMenus
      - package: Sparkle
        product: Sparkle
  MagpieTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies: [{ target: Magpie }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fr.anthony.magpie.tests
