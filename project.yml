name: Magpie
options:
  bundleIdPrefix: fr.anthony
  deploymentTarget: { macOS: "26.0" }
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
packages:
  Socle:
    path: Socle
targets:
  Magpie:
    type: application
    platform: macOS
    sources: [Sources, Ressources]
    info:
      path: Info.plist
      properties:
        LSUIElement: true            # app de barre de menus, sans icône dans le Dock ; retirer pour une app à fenêtre
        NSHumanReadableCopyright: "Usage personnel"
        CFBundleShortVersionString: $(MARKETING_VERSION)   # sinon XcodeGen fige « 1.0 »
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.anthony.magpie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
    dependencies:
      - package: Socle
        product: SocleCore
      - package: Socle
        product: SocleBarreDeMenus
  MagpieTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies: [{ target: Magpie }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fr.anthony.magpie.tests
